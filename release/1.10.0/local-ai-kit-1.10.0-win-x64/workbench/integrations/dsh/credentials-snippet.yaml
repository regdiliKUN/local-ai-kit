# ============================================================
#  integrations/dsh/credentials-snippet.yaml
#
#  Manual fallback. `python apply.py --apply` does this for you.
#
#  TARGET FILE:  ~/.dsh/.credentials.yaml
#
#  Add ONE line under the existing top-level `refs:` map. Do not
#  rewrite the whole file -- it also holds your browser-session
#  grant and your other provider keys.
# ============================================================

refs:
  # ... keep your existing keys ...
  STRATA_API_KEY: sk-local-qwen

# ============================================================
#  NOTES
#
#  * This is a LOCAL key. Strata binds to 127.0.0.1, so the value
#    never leaves your machine. It only has to match the `api_key`
#    field inside strata-<profile>.json and the `STRATA_API_KEY`
#    set in config\paths.bat.
#
#  * Never commit .credentials.yaml to git. It also contains real
#    cloud API keys.
# ============================================================
