name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 语法检查
        run: npm run lint

      - name: 单元测试
        run: npm test

      - name: 界面脚本语法检查
        run: |
          node --check ui/guidance.js
          node --check ui/strata.js
          node --check scripts/library.mjs
          node --check scripts/report.mjs
          node --check scripts/store.mjs
          node --check scripts/netcheck.mjs

      - name: 图表库自检（不依赖浏览器）
        run: |
          node --input-type=module -e "
            import fs from 'node:fs';
            const src = fs.readFileSync('ui/charts.js', 'utf8');
            for (const name of ['sparkline','donut','gauge','bars','radar','waterfall','line','heatmap','ring']) {
              if (!src.includes(name + '(')) { console.error('缺少图表函数: ' + name); process.exit(1); }
            }
            console.log('图表函数齐全');
          "

  self-check:
    name: 打包自检
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 确认运行时文件清单齐全
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node --input-type=module -e "import fs from 'node:fs'; const m = await import('./scripts/runtime-assets.mjs'); const missing = m.SCRIPT_FILES.filter(f => !fs.existsSync('scripts/' + f)); if (missing.length) { console.error('缺少运行时文件: ' + missing.join(', ')); process.exit(1); } console.log('运行时文件齐全 (' + m.SCRIPT_FILES.length + ' 个)');"

      - name: 界面文案翻译齐全
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = node scripts/extract-i18n.mjs
          Write-Output $out
          if ($out -notmatch '待翻译 0 条') {
            Write-Error ("有界面文案没翻译：`n" + $out)
          }

      - name: 确认批处理文件是 CRLF
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bad = @()
          Get-ChildItem -Recurse -Include *.cmd,*.bat,*.ps1 | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            for ($i = 0; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -eq 10 -and ($i -eq 0 -or $bytes[$i-1] -ne 13)) { $bad += $_.FullName; break }
            }
          }
          if ($bad.Count -gt 0) {
            Write-Error ("这些批处理文件不是 CRLF 结尾，cmd.exe 会出问题：`n" + ($bad -join "`n"))
          }
          Write-Output "批处理文件换行符正确"

      - name: 确认文档里的截图都存在
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $missing = @()
          Select-String -Path README.md, CHANGELOG.md -Pattern '\]\((docs/[^)]+\.png)\)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique |
            ForEach-Object {
              $p = Join-Path (Get-Location) $_
              if (-not (Test-Path $p)) { $missing += $_ }
            }
          if ($missing.Count -gt 0) {
            Write-Error ("文档引用了不存在的截图：`n" + ($missing -join "`n"))
          }
          Write-Output "文档引用的截图都在"
